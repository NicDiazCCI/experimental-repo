version: 2.1
orbs:
  node: circleci/node@7
jobs:
  build-node:
    # Build node project
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          command: npm run build
      - run:
          name: Create the ~/artifacts directory if it doesn't exist
          command: mkdir -p ~/artifacts
      # Copy output to artifacts dir
      - run:
          name: Copy artifacts
          command: cp -R build dist public .output .next .docusaurus ~/artifacts 2>/dev/null || true
      - store_artifacts:
          path: ~/artifacts
          destination: node-build
  test-node:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run tests
          command: |
            mkdir -p test-results
            TEST_FILES=$(circleci tests glob "src/**/*.{test,spec}.{js,ts}")
            echo "$TEST_FILES" | circleci tests run --command="xargs npm run test:run -- --reporter=junit --outputFile=test-results/junit.xml" --verbose
      - store_test_results:
          path: test-results
  lint-node:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run lint
          command: npm run lint
  # Test job for Chunk's handling of CircleCI status: infrastructure_fail.
  # Per https://discuss.circleci.com/t/47282, the control plane marks a
  # job as infrastructure_fail when it stops receiving heartbeats from
  # the agent. We provoke that here by severing the executor's outbound
  # networking once the step is running, leaving the agent unable to
  # report back. A machine executor is required because iptables needs
  # root + NET_ADMIN (not available on docker executors).
  infra-fail-test:
    machine:
      image: ubuntu-2204:current
    steps:
      - run:
          name: Cut outbound networking to force loss of contact
          command: |
            sudo iptables -P OUTPUT DROP
            sudo iptables -A OUTPUT -o lo -j ACCEPT
            # Sleep long past the control plane's heartbeat timeout.
            sleep 3600
workflows:
  build:
    jobs:
      - build-node
  test:
    jobs:
      - test-node
  lint:
    jobs:
      - lint-node
  infra-fail-test:
    jobs:
      - infra-fail-test