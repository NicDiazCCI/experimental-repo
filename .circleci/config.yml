version: 2.1
orbs:
  node: circleci/node@7
jobs:
  build-node:
    # Build node project
    executor: node/default
    steps:
      - checkout
      # Restore dependency cache
      - restore_cache:
          keys:
            - node-deps-v1-{{ checksum "package-lock.json" }}
            - node-deps-v1-
      - node/install-packages:
          pkg-manager: npm
      # Save dependency cache
      - save_cache:
          key: node-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - node_modules
      - run:
          command: npm run build
      - run:
          name: Create the ~/artifacts directory if it doesn't exist
          command: mkdir -p ~/artifacts
      # Copy output to artifacts dir
      - run:
          name: Copy artifacts
          command: cp -R build dist public .output .next .docusaurus ~/artifacts 2>/dev/null || true
      - store_artifacts:
          path: ~/artifacts
          destination: node-build
      # Persist workspace for test job
      - persist_to_workspace:
          root: .
          paths:
            - node_modules
            - build
            - dist
            - public
            - .output
            - .next
            - .docusaurus
  test-node:
    executor: node/default
    steps:
      - checkout
      # Attach workspace from build job
      - attach_workspace:
          at: .
      - run:
          name: Run tests
          command: |
            mkdir -p test-results
            TEST_FILES=$(circleci tests glob "src/**/*.{test,spec}.{js,ts}")
            echo "$TEST_FILES" | circleci tests run --command="xargs npm run test:run -- --reporter=junit --outputFile=test-results/junit.xml" --verbose
      - store_test_results:
          path: test-results
workflows:
  build-and-test:
    jobs:
      - build-node
      - test-node:
          requires:
            - build-node