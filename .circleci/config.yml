version: 2.1

orbs:
  node: circleci/node@7

executors:
  node-executor:
    docker:
      - image: cimg/node:lts
    resource_class: medium

jobs:
  install:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - node-deps-v1-{{ checksum "package-lock.json" }}
            - node-deps-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: node-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - persist_to_workspace:
          root: .
          paths:
            - node_modules
            - package.json
            - package-lock.json

  lint:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run ESLint
          command: npm run lint

  test:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run tests with Jest
          command: npm run test
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results

  build:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build TypeScript project
          command: npm run build
      - store_artifacts:
          path: dist
          destination: build-output

  # Deployment job stub - customize for your deployment target
  # deploy:
  #   executor: node-executor
  #   steps:
  #     - checkout
  #     - attach_workspace:
  #         at: .
  #     - run:
  #         name: Deploy to production
  #         command: |
  #           # Add your deployment commands here
  #           # Examples:
  #           # - Deploy to AWS: aws s3 sync dist/ s3://your-bucket
  #           # - Deploy to Vercel: vercel --prod
  #           # - Deploy to Netlify: netlify deploy --prod
  #           # - Deploy to Heroku: git push heroku main
  #           echo "Configure deployment commands here"

workflows:
  ci:
    jobs:
      - install
      - lint:
          requires:
            - install
      - test:
          requires:
            - install
      - build:
          requires:
            - install
