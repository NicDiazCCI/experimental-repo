version: 2.1

orbs:
  node: circleci/node@7

jobs:
  install-deps:
    executor: node/default
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-deps-{{ checksum "package-lock.json" }}
            - v1-npm-deps-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: v1-npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  lint:
    executor: node/default
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run ESLint
          command: npm run lint

  test:
    executor: node/default
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run Jest tests
          command: npm run test:run
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results

  build:
    executor: node/default
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build TypeScript
          command: npm run build
      - store_artifacts:
          path: dist
          destination: build-output
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # deploy:
  #   executor: node/default
  #   steps:
  #     - checkout
  #     - attach_workspace:
  #         at: .
  #     - run:
  #         name: Deploy application
  #         command: |
  #           # Add your deployment commands here
  #           # Example: npm run deploy
  #           # Example: scp -r dist/ user@server:/path/to/app
  #           # Example: aws s3 sync dist/ s3://your-bucket/
  #           echo "Deployment step - configure based on your deployment target"

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - install-deps
      - lint:
          requires:
            - install-deps
      - test:
          requires:
            - install-deps
      - build:
          requires:
            - install-deps
