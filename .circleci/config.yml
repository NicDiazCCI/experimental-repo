version: 2.1
orbs:
  node: circleci/node@7
jobs:
  build-and-test:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          cache-path: ~/.npm
      - run:
          name: Run tests
          command: npm run test:run -- --ci --maxWorkers=2
      - run:
          name: Build project
          command: npm run build
      - run:
          name: Copy artifacts
          command: |
            mkdir -p ~/artifacts
            cp -R dist ~/artifacts 2>/dev/null || true
      - store_artifacts:
          path: ~/artifacts
          destination: node-build
workflows:
  build-and-test:
    jobs:
      - build-and-test