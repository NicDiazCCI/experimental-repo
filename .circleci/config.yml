version: 2.1
orbs:
  node: circleci/node@7
jobs:
  build-node:
    # Build node project
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          command: npm run build
      - run:
          name: Create the ~/artifacts directory if it doesn't exist
          command: mkdir -p ~/artifacts
      # Copy output to artifacts dir
      - run:
          name: Copy artifacts
          command: cp -R build dist public .output .next .docusaurus ~/artifacts 2>/dev/null || true
      - store_artifacts:
          path: ~/artifacts
          destination: node-build
  test-node:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run tests
          command: |
            mkdir -p test-results
            TEST_FILES=$(circleci tests glob "src/**/*.{test,spec}.{js,ts}")
            echo "$TEST_FILES" | circleci tests run --command="xargs npm run test:run -- --reporter=junit --outputFile=test-results/junit.xml" --verbose
      - store_test_results:
          path: test-results
  lint-node:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run lint
          command: npm run lint
  # Intentionally references a non-existent Docker image to force the
  # executor to fail provisioning, which CircleCI tends to classify as
  # status: infrastructure_fail. Used to test Chunk's handling of that
  # failure mode.
  infra-fail-test:
    docker:
      - image: cimg/nonexistent-image-for-chunk-infra-fail-test:99.99.99
    steps:
      - run: echo "this should never execute"
workflows:
  build:
    jobs:
      - build-node
  test:
    jobs:
      - test-node
  lint:
    jobs:
      - lint-node
  infra-fail-test:
    jobs:
      - infra-fail-test