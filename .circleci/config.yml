version: 2.1

orbs:
  node: circleci/node@7

executors:
  node-executor:
    docker:
      - image: cimg/node:24.15
    resource_class: medium

jobs:
  install-dependencies:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - node-deps-v1-{{ checksum "package-lock.json" }}
            - node-deps-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: node-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  lint:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run ESLint
          command: npm run lint

  test:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run tests with coverage
          command: npm run test:run -- --coverage
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: coverage
          destination: coverage

  build:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build TypeScript project
          command: npm run build
      - run:
          name: Verify build output
          command: |
            if [ ! -d "dist" ]; then
              echo "Build failed: dist directory not found"
              exit 1
            fi
            echo "Build successful: $(find dist -type f | wc -l) files generated"
      - persist_to_workspace:
          root: .
          paths:
            - dist
      - store_artifacts:
          path: dist
          destination: build-output

  # Uncomment and configure the deploy job below when ready to add deployment
  # deploy:
  #   executor: node-executor
  #   steps:
  #     - checkout
  #     - attach_workspace:
  #         at: .
  #     - run:
  #         name: Deploy application
  #         command: |
  #           # Add your deployment commands here
  #           # Examples:
  #           # - npm run deploy
  #           # - npx semantic-release
  #           # - scp -r dist/ user@server:/path/
  #           # - aws s3 sync dist/ s3://your-bucket/
  #           echo "Configure deployment commands"

workflows:
  version: 2
  ci-pipeline:
    jobs:
      - install-dependencies
      - lint:
          requires:
            - install-dependencies
      - test:
          requires:
            - install-dependencies
      - build:
          requires:
            - install-dependencies
            - lint
            - test
      # Uncomment to enable deployment after build succeeds
      # - deploy:
      #     requires:
      #       - build
      #     filters:
      #       branches:
      #         only: main
