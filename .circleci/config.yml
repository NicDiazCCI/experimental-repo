version: 2.1
orbs:
  node: circleci/node@7

jobs:
  build-node:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          cache-path: ~/project/node_modules
          override-ci-command: npm ci
      - run:
          name: Typecheck
          command: npm run build
      - run:
          name: Create artifacts directory
          command: mkdir -p ~/artifacts
      - run:
          name: Copy build artifacts
          command: cp -R dist ~/artifacts 2>/dev/null || true
      - store_artifacts:
          path: ~/artifacts
          destination: node-build

  test-node:
    executor: node/default
    parallelism: 2
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          cache-path: ~/project/node_modules
          override-ci-command: npm ci
      - run:
          name: Run tests with coverage
          command: |
            mkdir -p test-results
            TEST_FILES=$(circleci tests glob "src/**/*.{test,spec}.{js,ts}")
            echo "$TEST_FILES" | circleci tests run \
              --command="xargs npm run test:run -- --coverage --coverageDirectory=coverage --reporter=junit --outputFile=test-results/junit.xml" \
              --verbose \
              --split-by=timings
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage
          destination: coverage-report

  lint:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          cache-path: ~/project/node_modules
          override-ci-command: npm ci
      - run:
          name: Lint
          command: npm run lint

workflows:
  ci:
    jobs:
      - build-node
      - lint
      - test-node:
          requires:
            - build-node
