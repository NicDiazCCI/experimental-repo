version: 2.1
orbs:
  node: circleci/node@7
jobs:
  build-node:
    # Build node project
    executor: node/default
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}
            - v1-deps-
      - node/install-packages:
          pkg-manager: npm
          cache-path: ~/project/node_modules
          override-ci-command: npm ci
      - save_cache:
          key: v1-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/project/node_modules
      - run:
          command: npm run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - dist
            - node_modules
      - store_artifacts:
          path: ~/project/dist
          destination: node-build
  test-node:
    executor: node/default
    parallelism: 2
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Run tests
          command: |
            mkdir -p test-results
            TESTFILES=$(circleci tests glob "src/**/*.{test,spec}.{js,ts}" | circleci tests split --split-by=timings)
            npm run test:run -- --reporter=junit --outputFile=test-results/junit.xml $TESTFILES
      - store_test_results:
          path: test-results
workflows:
  build-and-test:
    jobs:
      - build-node
      - test-node:
          requires:
            - build-node